name: Build NIN Slip Arranger Pro APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Extract project ZIP
        run: unzip -o NIN_Slip_Arranger_Pro_GitHub_Ready.zip

      - name: Install dependencies
        working-directory: NIN_Slip_Arranger_Pro
        run: npm install

      - name: Build web app
        working-directory: NIN_Slip_Arranger_Pro
        run: npm run build

      - name: Create Android project
        working-directory: NIN_Slip_Arranger_Pro
        run: npx cap add android

      - name: Sync Android
        working-directory: NIN_Slip_Arranger_Pro
        run: npx cap sync android

      - name: Build APK
        working-directory: NIN_Slip_Arranger_Pro
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NIN-Slip-Arranger-Pro-APK
          path: NIN_Slip_Arranger_Pro/android/app/build/outputs/apk/debug/app-debug.apk
          
